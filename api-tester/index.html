<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenRouter Key Tester</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#636c76; --line:#d8dee4; --accent:#2563eb; --ok:#15803d; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4c8dff; --ok:#3fb950; --err:#f85149; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:16px; margin:0 0 12px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, select, textarea, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  input, select, textarea { flex:1 1 220px; min-width:0; }
  textarea { width:100%; min-height:70px; resize:vertical; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; flex:0 0 auto; }
  button:disabled { opacity:.6; cursor:wait; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .stat b { display:block; font-size:12px; color:var(--muted); font-weight:500; }
  .ok { color:var(--ok); } .err { color:var(--err); } .muted { color:var(--muted); }
  .tablewrap { overflow-x:auto; max-height:460px; overflow-y:auto; margin-top:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { position:sticky; top:0; background:var(--card); }
  td.id { font-family:ui-monospace, monospace; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; border:1px solid var(--line); margin-right:3px; }
  pre { white-space:pre-wrap; word-break:break-word; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; margin:10px 0 0; max-height:360px; overflow:auto; }
  label.chk { display:flex; gap:6px; align-items:center; color:var(--muted); flex:0 0 auto; }
</style>
</head>
<body>
<main>
  <h1>OpenRouter Key Tester</h1>
  <p class="sub">Check your key's limits, browse the models it can use, and send a test chat. The key stays in this browser tab and is only sent to openrouter.ai.</p>

  <section>
    <h2>1. API key</h2>
    <div class="row">
      <input id="key" type="password" placeholder="sk-or-v1-..." autocomplete="off">
      <button id="btnKey">Check key</button>
    </div>
    <div id="keyOut" style="margin-top:12px"></div>
  </section>

  <section>
    <h2>2. Models</h2>
    <div class="row">
      <input id="filter" placeholder="Filter by name, e.g. nvidia, gemma, qwen">
      <label class="chk"><input id="freeOnly" type="checkbox" checked> Free only</label>
      <button id="btnModels">Load models</button>
    </div>
    <div id="modelsSummary" class="muted" style="margin-top:8px"></div>
    <div class="tablewrap"><table id="modelsTable" hidden>
      <thead><tr><th>Model</th><th>Context</th><th>Input</th><th>Output</th><th>$/1M in</th><th>$/1M out</th><th>Features</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <section>
    <h2>3. Test chat</h2>
    <div class="row">
      <select id="model"><option value="openrouter/free">openrouter/free (auto-picks a free model)</option></select>
    </div>
    <div style="margin-top:8px"><textarea id="prompt">Say hello and tell me which model you are in one sentence.</textarea></div>
    <div class="row" style="margin-top:8px"><button id="btnChat">Send</button><span id="chatMeta" class="muted"></span></div>
    <pre id="chatOut" hidden></pre>
  </section>
</main>

<script>
const API = "https://openrouter.ai/api/v1";
const $ = (id) => document.getElementById(id);
let allModels = [];

const key = () => $("key").value.trim();
const headers = () => ({ "Authorization": "Bearer " + key(), "Content-Type": "application/json" });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const perM = (p) => { const n = Number(p); return !p || n === 0 ? "free" : n < 0 ? "varies" : "$" + (n * 1e6).toFixed(2); };
const isFree = (m) => m.id.endsWith(":free") || (Number(m.pricing?.prompt) === 0 && Number(m.pricing?.completion) === 0);

async function call(path, opts = {}) {
  if (!key()) throw new Error("Enter your API key first.");
  const res = await fetch(API + path, { headers: headers(), ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(`${res.status}: ${body.error?.message || JSON.stringify(body)}`);
  return body;
}

async function busy(btn, fn) {
  btn.disabled = true;
  try { await fn(); } finally { btn.disabled = false; }
}

$("btnKey").onclick = () => busy($("btnKey"), async () => {
  const out = $("keyOut");
  try {
    const { data: d } = await call("/key");
    const daily = d.free_model_daily_requests;
    const stats = [
      ["Status", '<span class="ok">Valid</span>'],
      ["Tier", d.is_free_tier ? "Free tier" : "Paid"],
      ["Credit limit", d.limit == null ? "Unlimited" : "$" + d.limit],
      ["Remaining", d.limit_remaining == null ? "—" : "$" + d.limit_remaining],
      ["Usage (total)", "$" + (d.usage ?? 0)],
      ["Usage (today)", "$" + (d.usage_daily ?? 0)],
      ["Free requests today", daily ? `${daily.used} / ${daily.limit}` : "—"],
      ["Expires", d.expires_at ? new Date(d.expires_at).toLocaleDateString() : "Never"],
    ];
    out.innerHTML = '<div class="grid">' + stats.map(([k, v]) => `<div class="stat"><b>${k}</b>${v}</div>`).join("") + "</div>";
  } catch (e) {
    out.innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
});

function renderModels() {
  const q = $("filter").value.toLowerCase();
  const list = allModels.filter(m => (!$("freeOnly").checked || isFree(m)) && (m.id + " " + m.name).toLowerCase().includes(q));
  $("modelsSummary").textContent = `${allModels.length} models available · ${allModels.filter(isFree).length} free · showing ${list.length}`;
  $("modelsTable").hidden = false;
  $("modelsTable").tBodies[0].innerHTML = list.map(m => {
    const a = m.architecture || {};
    const feats = (m.supported_parameters || []).filter(p => ["tools", "reasoning", "structured_outputs", "response_format", "web_search_options"].includes(p));
    return `<tr><td class="id" title="${esc(m.name)}">${esc(m.id)}</td>
      <td>${(m.context_length || 0).toLocaleString()}</td>
      <td>${esc((a.input_modalities || []).join(", "))}</td>
      <td>${esc((a.output_modalities || []).join(", "))}</td>
      <td>${perM(m.pricing?.prompt)}</td><td>${perM(m.pricing?.completion)}</td>
      <td>${feats.map(f => `<span class="tag">${esc(f)}</span>`).join("")}</td></tr>`;
  }).join("");
  const sel = $("model"), cur = sel.value;
  sel.innerHTML = '<option value="openrouter/free">openrouter/free (auto-picks a free model)</option>' +
    list.filter(m => m.id !== "openrouter/free").map(m => `<option value="${esc(m.id)}">${esc(m.id)}${isFree(m) ? "" : " (paid)"}</option>`).join("");
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}

$("btnModels").onclick = () => busy($("btnModels"), async () => {
  try {
    allModels = (await call("/models")).data.sort((a, b) => a.id.localeCompare(b.id));
    renderModels();
  } catch (e) {
    $("modelsSummary").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
});
$("filter").oninput = () => allModels.length && renderModels();
$("freeOnly").onchange = () => allModels.length && renderModels();

$("btnChat").onclick = () => busy($("btnChat"), async () => {
  const out = $("chatOut");
  out.hidden = false;
  out.textContent = "Waiting for response...";
  $("chatMeta").textContent = "";
  const t0 = performance.now();
  try {
    const r = await call("/chat/completions", {
      method: "POST",
      body: JSON.stringify({ model: $("model").value, messages: [{ role: "user", content: $("prompt").value }] }),
    });
    const msg = r.choices?.[0]?.message || {};
    out.textContent = (msg.reasoning ? "[reasoning]\n" + msg.reasoning + "\n\n[answer]\n" : "") + (msg.content ?? JSON.stringify(r, null, 2));
    const u = r.usage || {};
    $("chatMeta").textContent = `${r.model} via ${r.provider || "?"} · ${((performance.now() - t0) / 1000).toFixed(1)}s · ${u.prompt_tokens ?? "?"} in / ${u.completion_tokens ?? "?"} out tokens`;
  } catch (e) {
    out.innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
});
</script>
</body>
</html>
