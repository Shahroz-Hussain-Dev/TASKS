apply plugin: 'com.android.application'

// Release signing: android/keystore.properties (gitignored) holds the upload key.
// When it is absent the build falls back to the debug keystore so that
// `gradlew assembleRelease` always produces an installable, minified APK.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
    def requiredKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
    def missing = requiredKeys.findAll { key -> !keystoreProperties.containsKey(key) || keystoreProperties.getProperty(key).trim().isEmpty() }
    if (!missing.isEmpty()) {
        throw new GradleException("keystore.properties is missing required keys: ${missing.join(', ')}")
    }
    def storeFile = rootProject.file(keystoreProperties.getProperty("storeFile"))
    if (!storeFile.exists()) {
        throw new GradleException("keystore.properties points at a keystore that does not exist: ${storeFile.absolutePath}")
    }
    hasReleaseKeystore = true
}

android {
    namespace = "pk.raahi.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pk.raahi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    bundle {
        language {
            // The web bundle carries its own copy; keep every locale in one base split.
            enableSplit = false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

gradle.projectsEvaluated {
    if (hasReleaseKeystore) {
        logger.lifecycle("Raahi: release builds are signed with the upload keystore from keystore.properties.")
    } else {
        logger.lifecycle("Raahi: keystore.properties not found - release builds are signed with the debug keystore. See android-signing.md.")
    }
}
