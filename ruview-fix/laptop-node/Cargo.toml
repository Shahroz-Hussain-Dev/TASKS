[package]
name = "ruview-laptop-node"
version = "1.0.0"
edition = "2021"
description = "Turns a Windows laptop's WiFi adapter into a RuView sensing node (RSSI-based, ESP32 ADR-018 frame format)"
license = "MIT"
publish = false

[dependencies]
mdns-sd = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WiFi",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
